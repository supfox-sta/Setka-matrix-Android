[project]
name = "setka-plus-synapse-module"
version = "0.1.0"
description = "Setka Plus subscriptions with Robokassa for Synapse"
requires-python = ">=3.9"
dependencies = []

[project.entry-points."synapse.module"]
setka_plus = "setka_plus_synapse_module:SetkaPlusModule"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["setka_plus_synapse_module*"]
